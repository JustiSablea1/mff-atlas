<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0e17">
  <meta name="apple-mobile-web-app-title" content="MFF Atlas">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg">
  <link rel="apple-touch-icon" href="./v2/apple-touch-icon.png">
  <link rel="stylesheet" href="./v2/style.css">
  <title>MFF Atlas — план развития</title>
</head>
<body>
  <header class="top"><div class="shell top-inner"><a class="brand" href="#plan"><span class="mark" aria-hidden="true">A</span><span>MFF <strong>ATLAS</strong></span></a><span id="release">2.0.0</span></div></header>
  <div id="update" class="shell" hidden><div class="banner"><span>Обновление готово</span><button id="apply-update">Обновить</button></div></div>
  <main class="shell" id="view"><p>Загрузка MFF Atlas…</p><noscript>Для работы приложения нужен JavaScript.</noscript></main>
  <div id="notice" role="status" aria-live="polite" hidden></div>
  <nav aria-label="Разделы приложения"><div class="shell nav-inner">
    <a href="#plan"><span aria-hidden="true">◇</span>План</a>
    <a href="#roster"><span aria-hidden="true">▦</span>Герои</a>
    <a href="#inventory"><span aria-hidden="true">◈</span>Запасы</a>
    <a href="#import"><span aria-hidden="true">⇩</span>Импорт</a>
    <a href="#data"><span aria-hidden="true">▤</span>Данные</a>
  </div></nav>
  <script>window.setTimeout(function () { if (!window.atlasStarted) document.getElementById('view').textContent = 'Приложение не загрузилось. Открой MFF Atlas онлайн и обнови страницу.'; }, 15000);</script>
  <script type="module" src="./v2/app.mjs"></script>
</body>
</html>
