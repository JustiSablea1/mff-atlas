<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="MFF Atlas"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><title>MFF Atlas</title><style>:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;background:#0b1220;color:#edf4ff}*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}header{position:sticky;top:0;background:#101827f5;border-bottom:1px solid #2d405e;padding:16px;z-index:2}h1{font-size:23px;margin:0}button{touch-action:manipulation}input,textarea,select{font-size:16px}small,.muted{color:#9fb2d0}main{max-width:850px;margin:auto;padding:16px}nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:12px 0}nav button{padding:10px 3px;font-size:12px;overflow-wrap:anywhere}button,select,input,textarea{font:inherit;background:#18263d;color:white;border:1px solid #405371;border-radius:11px;padding:11px;min-width:0}button{cursor:pointer}button.primary{background:#286acb;border-color:#377de0}nav button.active{background:#286acb}input[type=search]{width:100%}.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.card{background:#131f33;border:1px solid #2a3c57;border-radius:16px;padding:15px;margin:10px 0}.item{display:flex;justify-content:space-between;align-items:center;gap:8px}.item strong{font-size:16px}.tag{font-size:12px;background:#2c4467;border-radius:8px;padding:4px 7px;white-space:nowrap}.stats{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.stat{font-size:12px;padding:5px 8px;border-radius:7px;background:#34445c}.SSS{background:#8b303a}.SS{background:#ad6932}.S{background:#917d32}.A{background:#327a65}.B,.C{background:#41536e}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}label{display:block;margin:9px 0 4px;color:#b7c8e2;font-size:13px}textarea{width:100%;min-height:95px}details{margin-top:8px}summary{cursor:pointer;color:#b8d4ff}.note{font-size:13px;line-height:1.5;color:#b8c7dd}a{color:#8dbdff}img.preview{max-width:100%;max-height:220px;border-radius:8px;margin:5px}#notice{font-size:13px;color:#a8d6b8;margin-top:6px}body{overflow-x:hidden}header{position:relative;top:auto;padding:14px 16px 12px}header h1{font-size:22px;line-height:1.25}header>small{display:block;font-size:11px;line-height:1.35;margin-top:4px}main{padding:12px 14px 35px;max-width:100%;min-width:0}nav{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;margin:0 0 14px}nav button{font-size:clamp(10px,2.65vw,13px);line-height:1.15;min-height:48px;padding:8px 3px;white-space:normal;overflow-wrap:break-word}button,select,input,textarea{font-size:16px;max-width:100%;min-width:0}button{white-space:normal}input[type=file]{display:block;width:100%;font-size:13px;padding:10px 6px}input[type=file]::file-selector-button{font-size:13px;border-radius:8px;border:1px solid #526788;background:#243754;color:#fff;padding:8px;margin-right:6px}.card{padding:14px;margin:10px 0;min-width:0;overflow-wrap:anywhere}.card h2,.card h3{margin:4px 0 14px;font-size:19px}.card p{font-size:14px;line-height:1.5}.card input:not([type=checkbox]):not([type=file]),.card textarea{width:100%;display:block}.card select{max-width:100%;width:100%}.card button{margin:6px 4px 4px 0}.card .item button{flex-shrink:0}.item{min-width:0}.item>div{min-width:0}.row{flex-wrap:wrap}.row>*{flex-basis:100%}.filters{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.stats{gap:5px}.stat{font-size:11px}.note{overflow-wrap:anywhere}#view{min-width:0}#view>h2{font-size:21px;margin:12px 0}textarea{resize:vertical}html{-webkit-text-size-adjust:100%}@media(min-width:650px){main{max-width:750px}.row>*{flex-basis:auto}} </style></head><body><header><h1>⚡ MFF Atlas <small>1.4</small></h1><small>Персональный справочник Marvel Future Fight · iPhone</small><div id="notice"></div></header><main><nav><button data-tab="roster" class="active">Персонажи</button><button data-tab="account">Мой аккаунт</button><button data-tab="import">Импорт</button><button data-tab="settings">Данные</button></nav><div id="view"></div></main><script>
const names={Universal:"Jean Grey|Sentry|Knull|Ghost Rider|Gorr|Kang|Doctor Doom|Zeus|Hela|Thor|Loki|Scarlet Witch|Galactus|Silver Surfer|Black Cat",Blast:"Mephisto|Adam Warlock|Sharon Rogers|Doctor Strange|Magneto|Storm|Iron Man|Psylocke|Stryfe",Speed:"Luna Snow|Spider-Man|Black Swan|Cassandra Nova|Miles Morales|Gamora|White Fox|Shuri",Combat:"Wolverine|Shang-Chi|Sentinel|Black Knight|Deadpool|Hulk|Venom|Valkyrie"};
const seed=[];Object.entries(names).forEach(([type,ns])=>ns.split("|").forEach(name=>seed.push({id:name.toLowerCase().replace(/[^a-z0-9]/g,"-"),name,type,pve:"?",pvp:"?",support:"?",role:"Не указана",uniform:"",ctp:"",notes:"",owned:false,tier:"",level:"",build:""})));
const key="mff-atlas-v12";let db;try{db=JSON.parse(localStorage.getItem(key))}catch(e){}if(!db||!Array.isArray(db.characters))db={player:"MasterCasfer92",characters:seed,version:1};for(const c of seed)if(!db.characters.some(x=>x.id===c.id))db.characters.push(c);
let tab="account",filter="",type="All",sort="name";const $=id=>document.getElementById(id);const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const save=()=>{localStorage.setItem(key,JSON.stringify(db));$("notice").textContent="Сохранено на этом iPhone";setTimeout(()=>{if($("notice"))$("notice").textContent=""},2500)};const field=(id,label,val)=>'<label for="'+id+'">'+label+'</label><input id="'+id+'" value="'+esc(val)+'">';
function render(){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));const v=$("view");if(tab==="roster"){let list=db.characters.filter(c=>(type==="All"||c.type===type)&&c.name.toLowerCase().includes(filter.toLowerCase()));list.sort((a,b)=>sort==="name"?a.name.localeCompare(b.name):String(b[sort]||"").localeCompare(String(a[sort]||"")));v.innerHTML='<input id="search" type="search" placeholder="Поиск персонажа..." value="'+esc(filter)+'"><div class="filters"><select id="type">'+["All","Combat","Blast","Speed","Universal"].map(t=>'<option '+(type===t?"selected":"")+'>'+t+'</option>').join("")+'</select><select id="sort">'+[["name","По имени"],["pve","По PvE"],["pvp","По PvP"],["support","По поддержке"]].map(([k,t])=>'<option value="'+k+'" '+(sort===k?"selected":"")+'>'+t+'</option>').join("")+'</select></div><small>Найдено '+list.length+' · Нажми «Изменить», чтобы указать сборку и оценки.</small>'+list.map(c=>'<div class="card"><div class="item"><div><strong>'+esc(c.name)+'</strong> '+(c.owned?"⭐":"")+'<div class="muted">'+esc(c.type)+' · '+esc(c.role)+'</div></div><button onclick="edit('+db.characters.indexOf(c)+')">Изменить</button></div><div class="stats">'+["pve","pvp","support"].map(k=>'<span class="stat '+esc(c[k])+'">'+k.toUpperCase()+': '+esc(c[k])+'</span>').join("")+'</div><div class="note">'+(c.uniform?"Костюм: "+esc(c.uniform)+" · ":"")+(c.ctp?"CTP: "+esc(c.ctp):"")+'</div></div>').join("");$("search").oninput=e=>{filter=e.target.value;render();$("search").focus();$("search").setSelectionRange(filter.length,filter.length)};$("type").onchange=e=>{type=e.target.value;render()};$("sort").onchange=e=>{sort=e.target.value;render()};}
if(tab==="account"){let owned=db.characters.filter(c=>c.owned);v.innerHTML='<div class="card"><h2>Аккаунт '+esc(db.player)+'</h2><p>Отмечено персонажей: <strong>'+owned.length+'</strong> / '+db.characters.length+'</p><button class="primary" id="goimport">Загрузить персонажей</button><p class="note">Для импорта открой вкладку «Импорт» и вставь список имён. Перед сохранением Atlas покажет найденные совпадения.</p><p class="note">Данные хранятся только в браузере этого устройства. Делай резервную копию JSON перед очисткой Safari или переустановкой.</p></div>'+owned.map(c=>'<div class="card"><div class="item"><strong>'+esc(c.name)+'</strong><button onclick="edit('+db.characters.indexOf(c)+')">Сборка</button></div><small>'+esc(c.type)+' · '+esc(c.level||"Уровень не указан")+' · '+esc(c.ctp||"CTP не указан")+'</small></div>').join("")}
if(tab==="import"){v.innerHTML='<h2>Импорт аккаунта</h2><div class="card"><p>Выбери скриншоты ростера MFF. Они останутся на устройстве и будут показаны ниже для проверки.</p><input type="file" id="photos" accept="image/*" multiple><div id="previews"></div></div><div class="card"><h3>Импорт персонажей по именам</h3><p class="note">На iPhone открой скриншот в «Фото», выдели текст через Live Text, скопируй его сюда. Atlas сопоставит имена с базой. Можно также просто написать имена по одному в строке.</p><textarea id="ocr" placeholder="Вставь имена персонажей из скриншотов"></textarea><button class="primary" id="match">Найти персонажей</button><div id="matches"></div></div>';$("photos").onchange=e=>{const p=$("previews");p.innerHTML="";for(const file of [...e.target.files].slice(0,30)){const im=document.createElement("img");im.className="preview";im.src=URL.createObjectURL(file);im.onload=()=>URL.revokeObjectURL(im.src);p.append(im)}};$("match").onclick=()=>{const txt=$("ocr").value.toLowerCase();const found=db.characters.filter(c=>txt.includes(c.name.toLowerCase()));$("matches").innerHTML='<p>Совпадений: '+found.length+'</p>'+found.map(c=>'<label><input type="checkbox" class="found" value="'+esc(c.id)+'" checked> '+esc(c.name)+'</label>').join("")+'<button id="confirm" class="primary">Отметить выбранных как полученных</button>';$("confirm").onclick=()=>{document.querySelectorAll(".found:checked").forEach(x=>{const c=db.characters.find(c=>c.id===x.value);if(c)c.owned=true});save();tab="account";render()}}}
if(tab==="settings"){v.innerHTML='<h2>Настройки и резервное копирование</h2><div class="card">'+field("player","Игровой ник",db.player)+'<button id="saveplayer">Сохранить ник</button></div><div class="card"><h3>Экспорт и импорт</h3><p class="note">JSON сохраняет персонажей и твои сборки. Не публикуй резервную копию, если не хочешь раскрывать данные аккаунта.</p><button id="export" class="primary">Скачать JSON</button> <button id="csv">Скачать CSV</button><label>Восстановить из JSON</label><input id="restore" type="file" accept=".json,application/json"></div><div class="card"><h3>Добавить персонажа</h3>'+field("newname","Имя","")+'<select id="newtype">'+Object.keys(names).map(x=>'<option>'+x+'</option>').join("")+'</select><button id="add">Добавить</button></div><p class="note">Оценки по умолчанию не заполнены: без проверенных данных патча не стоит выдавать предположения за мету. Это редактируемый персональный каталог.</p>';$("saveplayer").onclick=()=>{db.player=$("player").value.trim()||db.player;save();render()};$("export").onclick=()=>download("mff-atlas-backup.json",JSON.stringify(db,null,2),"application/json");$("csv").onclick=()=>{const keys=["name","type","role","pve","pvp","support","uniform","ctp","owned","level","notes"];download("mff-atlas.csv",keys.join(",")+"\n"+db.characters.map(c=>keys.map(k=>'"'+String(c[k]??"").replace(/"/g,'""')+'"').join(",")).join("\n"),"text/csv")};$("restore").onchange=async e=>{try{const o=JSON.parse(await e.target.files[0].text());if(!Array.isArray(o.characters))throw Error("Неверный формат");if(confirm("Заменить локальную базу резервной копией?")){db=o;save();render()}}catch(e){alert("Ошибка импорта: "+e.message)}};$("add").onclick=()=>{const name=$("newname").value.trim();if(!name)return;db.characters.push({...seed[0],id:"custom-"+Date.now(),name,type:$("newtype").value,owned:false});save();tab="roster";render()}}}
function download(name,data,mime){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:mime}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
window.edit=function(i){const c=db.characters[i];const v=$("view");v.innerHTML='<button id="back">← Назад</button><h2>'+esc(c.name)+'</h2><div class="card"><label><input id="owned" type="checkbox" '+(c.owned?"checked":"")+'> Есть в аккаунте</label>'+field("level","Уровень / T3 / T4",c.level)+field("role","Роль",c.role)+field("uniform","Костюм",c.uniform)+field("ctp","CTP",c.ctp)+["pve","pvp","support"].map(k=>'<label>'+k.toUpperCase()+'</label><select id="'+k+'">'+["?","SSS","SS","S","A","B","C"].map(t=>'<option '+(c[k]===t?"selected":"")+'>'+t+'</option>').join("")+'</select>').join("")+'<label>Заметки / артефакт / карты</label><textarea id="notes">'+esc(c.notes)+'</textarea><button id="savechar" class="primary">Сохранить</button></div>';$("back").onclick=render;$("savechar").onclick=()=>{c.owned=$("owned").checked;for(const k of ["level","role","uniform","ctp","pve","pvp","support","notes"])c[k]=$(k).value;save();render()}}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});document.addEventListener("click",e=>{if(e.target&&e.target.id==="goimport"){tab="import";render()}});render();if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script></body></html>
